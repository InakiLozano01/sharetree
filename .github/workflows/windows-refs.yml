name: Windows ReFS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-refs:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Record revision and Windows runner
        shell: pwsh
        run: |
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Runner $env:RUNNER_OS $env:RUNNER_ARCH ($env:ImageOS $env:ImageVersion)"
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber
      - name: Run the ReFS worktree regression
        shell: pwsh
        run: ./scripts/test-windows-refs.ps1
